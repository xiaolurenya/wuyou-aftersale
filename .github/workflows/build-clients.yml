name: Build & Release Clients
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Use preinstalled Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME"
      - name: Install Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.7 --distribution-type bin
          chmod +x gradlew
      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
      - name: Sign APK (v2/v3, apksigner)
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          keytool -genkeypair -v -keystore release.keystore -alias wuyou -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass wuyou123 -keypass wuyou123 -dname 'CN=Wuyou Aftersale, O=Wuyou, C=CN'
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort | tail -1)
          zipalign -p -f 4 "$APK" signed.apk || cp "$APK" signed.apk
          "$APKSIGNER" sign --ks release.keystore --ks-pass pass:wuyou123 --key-pass pass:wuyou123 \
            --v2-signing-enabled true --v3-signing-enabled true --out WuyouAftersale-signed.apk signed.apk
          "$APKSIGNER" verify --verbose WuyouAftersale-signed.apk
          echo "APK_PATH=android/WuyouAftersale-signed.apk" >> $GITHUB_ENV
      - name: Locate APK
        id: apk
        run: echo "path=WuyouAftersale-signed.apk" >> $GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: wuyou-android-apk
          path: android/WuyouAftersale-signed.apk
      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/WuyouAftersale-signed.apk

  windows-exe:
    runs-on: windows-latest
    defaults: { run: { working-directory: desktop } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install --no-audit --no-fund
      - run: npm run build:win
      - uses: actions/upload-artifact@v4
        with: { name: wuyou-windows-installer, path: desktop/dist/*.exe }
      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/*.exe

  linux-appimage:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: desktop } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install --no-audit --no-fund
      - run: npx electron-builder --linux AppImage
      - uses: actions/upload-artifact@v4
        with: { name: wuyou-linux-appimage, path: desktop/dist/*.AppImage }
      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: { files: desktop/dist/*.AppImage }

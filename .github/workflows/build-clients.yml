name: Build & Release Clients
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android-apk:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.7 --distribution-type bin
          chmod +x gradlew
      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
      - name: Sign APK
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          keytool -genkeypair -v -keystore release.keystore -alias wuyou -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass wuyou123 -keypass wuyou123 -dname 'CN=Wuyou Aftersale, O=Wuyou, C=CN'
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort | tail -1)
          zipalign -p -f 4 "$APK" signed.apk || cp "$APK" signed.apk
          "$APKSIGNER" sign --ks release.keystore --ks-pass pass:wuyou123 --key-pass pass:wuyou123 \
            --v2-signing-enabled true --v3-signing-enabled true --out WuyouAftersale-1.6.5-Android.apk signed.apk
          "$APKSIGNER" verify --verbose WuyouAftersale-1.6.5-Android.apk
      - uses: actions/upload-artifact@v4
        with: { name: wuyou-android-apk, path: android/WuyouAftersale-1.6.5-Android.apk }
      - name: Upload APK to v1.0.3
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload v1.0.3 android/WuyouAftersale-1.6.5-Android.apk --repo "${{ github.repository }}" --clobber

  windows-exe:
    runs-on: windows-latest
    defaults: { run: { working-directory: desktop } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install --no-audit --no-fund
      - run: npm run build:win
      - name: Rename single installer
        shell: bash
        run: |
          EXE=$(find dist -maxdepth 1 -iname '*Setup*.exe' | head -1)
          cp "$EXE" dist/WuyouAftersale-1.6.5-Windows-Setup.exe
      - uses: actions/upload-artifact@v4
        with: { name: wuyou-windows-installer, path: desktop/dist/WuyouAftersale-1.6.5-Windows-Setup.exe }
      - name: Upload Setup.exe to v1.0.3
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload v1.0.3 desktop/dist/WuyouAftersale-1.6.5-Windows-Setup.exe --repo "${{ github.repository }}" --clobber
          gh release view v1.0.3 --repo "${{ github.repository }}" --json assets --jq '.assets[].name'

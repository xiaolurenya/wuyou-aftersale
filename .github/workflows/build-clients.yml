name: Build & Release Clients
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: Install Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.7 --distribution-type bin || true
          chmod +x gradlew
      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
      - name: Locate APK
        id: apk
        run: echo "path=$(find app/build/outputs/apk/release -name '*.apk' | head -1)" >> $GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with: { name: wuyou-android-apk, path: ${{ steps.apk.outputs.path }} }
      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: { files: ${{ steps.apk.outputs.path }} }

  windows-exe:
    runs-on: windows-latest
    defaults: { run: { working-directory: desktop } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install --no-audit --no-fund
      - run: npm run build:win
      - uses: actions/upload-artifact@v4
        with: { name: wuyou-windows-installer, path: desktop/dist/*.exe }
      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: { files: desktop/dist/*.exe }

  linux-appimage:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: desktop } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install --no-audit --no-fund
      - run: npx electron-builder --linux AppImage
      - uses: actions/upload-artifact@v4
        with: { name: wuyou-linux-appimage, path: desktop/dist/*.AppImage }
      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: { files: desktop/dist/*.AppImage }

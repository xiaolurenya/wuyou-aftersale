name: Docs Check

"on": [push, pull_request]

permissions:
  contents: read

jobs:
  docs-check:
    name: Documentation checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout documentation repository
        uses: actions/checkout@v4

      - name: Verify required documentation files exist
        run: |
          set -euo pipefail
          for f in README.md docs/FAQ.md docs/INSTALL.md docs/CHANGELOG.md docs/PRICING.md LICENSE; do
            if [ ! -f "$f" ]; then
              echo "Missing required file: $f" >&2
              exit 1
            fi
          done
          echo "All required documentation files are present."

      - name: Reject sensitive strings in markdown files
        run: |
          set -euo pipefail
          pattern='PRIVATE KEY|BEGIN PRIVATE KEY|BEGIN RSA PRIVATE KEY|BEGIN OPENSSH PRIVATE KEY|TEST-LICENSE|SECRET KEY|ACTIVATION CODE='
          if grep -RInE --include="*.md" "$pattern" .; then
            echo "Sensitive string detected in markdown files." >&2
            exit 1
          fi
          echo "No sensitive strings found in markdown files."

      - name: Basic markdown link format check
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          root = pathlib.Path('.')
          link_re = re.compile(r'!?\[[^\]]*\]\(([^)]*)\)')
          problems = []

          for md in sorted(root.rglob('*.md')):
              for lineno, line in enumerate(md.read_text(encoding='utf-8').splitlines(), 1):
                  for target in link_re.findall(line):
                      target = target.strip()
                      if any(ch.isspace() for ch in target):
                          problems.append(f'{md}:{lineno}: link target contains whitespace -> {target}')
                          continue
                      if target.startswith(('http://', 'https://', 'mailto:', '#')):
                          continue
                      if not target:
                          problems.append(f'{md}:{lineno}: empty link target')
                          continue
                      rel = target.split('#', 1)[0]
                      if not (md.parent / rel).resolve().exists():
                          problems.append(f'{md}:{lineno}: broken link -> {target}')

          if problems:
              print('\n'.join(problems))
              sys.exit(1)
          print('Markdown link format and relative targets look OK.')
          PY

services:
  aftersale:
    # 交付镜像：由私有源码仓构建后推送到 GHCR，公开仓不含任何源码
    image: xiaoluya/wuyou-aftersale:1.0.0
    container_name: aftersale
    restart: unless-stopped
    ports:
      - "3650:3650"
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    environment:
      TZ: Asia/Shanghai
      PORT: "3650"
      DATA_DIR: /app/data
      NODE_ENV: production
      TRIAL_DAYS: "15"
      # 正式发布包请设为 0（启用 15 天试用）；此处 1 仅用于作者本机测试
      TRIAL_BYPASS: "${TRIAL_BYPASS:-0}"
      SESSION_SECRET: "${SESSION_SECRET:-}"
      BOOTSTRAP_ADMIN_USER: "${BOOTSTRAP_ADMIN_USER:-admin}"
      BOOTSTRAP_ADMIN_PASSWORD: "${BOOTSTRAP_ADMIN_PASSWORD:-Admin@3650}"
      # 联系方式自动同步地址（联网时拉取，断网回退内置）
      CF_CONFIG_URL: "${CF_CONFIG_URL:-https://as.xlry.cc.cd/v1/config}"
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:3650/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
